name: CI

# Каждая проверка отвечает на конкретный вопрос:
#   contract    — сгенерированный код совпадает с api/openapi.yaml?
#   lint        — код проходит статический анализ?
#   test        — бизнес-правила работают и нет гонок?
#   integration — гарантии консистентности держатся на настоящем PostgreSQL?
#   docker      — стек собирается, поднимается и держит инвариант под нагрузкой?
#   diagrams    — документация рендерится из исходников?

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: незачем занимать раннеры
# проверкой кода, который уже неактуален.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.13.1"

jobs:
  contract:
    name: Контракт и кодогенерация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Если контракт правили, а `make gen` не выполняли, сгенерированный код
      # разъедется со спецификацией — здесь это видно сразу.
      - name: Сгенерированный код совпадает с контрактом
        run: make gen-check

  lint:
    name: Статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: go vet (включая файлы под тегом integration)
        run: go vet -tags=integration ./...

  test:
    name: Модульные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -count=1 ./...

  integration:
    name: Интеграционные тесты (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Миграции применяются самими тестами (TestMain), поэтому отдельного шага
      # не нужно — заодно проверяется, что они применимы с нуля.
      - name: go test -tags=integration
        env:
          TEST_DATABASE_URL: postgres://kitchen:kitchen@localhost:5432/kitchen?sslmode=disable
        run: go test -race -count=1 -tags=integration ./internal/adapters/postgres/...

  docker:
    name: Сборка и запуск стека
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker compose build
        run: docker compose build

      - name: Поднять стек
        run: docker compose up -d --wait

      - name: Сквозной сценарий (smoke.sh)
        run: make smoke

      # В CI гоняется только сценарий гонки: он проверяет инвариант
      # «нельзя продать больше, чем есть», а не производительность. Числа
      # задержек на общих раннерах всё равно ничего не значат, а вот
      # перепродажу под конкуренцией этот прогон ловит железно.
      - name: Гонка за остатком (k6)
        run: |
          docker run --rm --network host -v "$PWD/load:/load:ro" grafana/k6 run \
            -e BASE_URL=http://localhost:8080 \
            -e STOCK=100 -e ITERATIONS=300 -e VUS=30 \
            /load/contention.js

      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color

      - name: Погасить стек
        if: always()
        run: docker compose down -v

  diagrams:
    name: Рендер диаграмм
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Диаграммы — часть документации и обязаны собираться из исходников.
      # Рендер идёт через встроенный Smetana, поэтому graphviz не нужен.
      - name: make diagrams
        run: make diagrams

      - name: Отрендеренные SVG совпадают с закоммиченными
        run: |
          if ! git diff --quiet -- docs/diagrams; then
            echo "SVG расходятся с .puml — выполните make diagrams и закоммитьте результат"
            git diff --stat -- docs/diagrams
            exit 1
          fi
